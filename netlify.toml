[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/knowledge.json"]

# Redirect legacy index_new.html requests to index.html
[[redirects]]
  from = "/index_new.html"
  to = "/index.html"
  status = 301

# ── Cache-Control headers ─────────────────────────────────────────────────────

# WebP frames — immutable, cache for 1 year (huge win for return visitors)
[[headers]]
  for = "/frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images & other static assets — cache 7 days
[[headers]]
  for = "/Images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Music — cache 7 days
[[headers]]
  for = "/Music/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML — always revalidate so updates are picked up immediately
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
